# أضف هذا لـpostgresql.conf (أو conf.d/) على سيرفر العيادة، ثم أعد تشغيل PostgreSQL مرة وحدة (archive_mode يحتاج restart).
wal_level = replica
archive_mode = on
# ينسخ ملف WAL لمجلد انتظار محلي بشكل متين ثم يرجع نجاح. الرفع للتخزين البعيد يسويه clinic-backup-ship (فانقطاع الإنترنت ما يوقف القاعدة).
archive_command = '/usr/bin/node /opt/clinic/server/dist/cli/backup.js archive-wal --spool /var/lib/clinic-backup/spool "%p" "%f"'
# يجبر قلب ملف WAL كل 5 دقايق إذا صار نشاط: هذا اللي يحدد أقصى خسارة (5 دقايق)
archive_timeout = 300
# pg_basebackup يحتاج اتصال نسخ
max_wal_senders = 3
