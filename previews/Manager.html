<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>معاينة المدير — مركز التجميل</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#084F4B}
button{font-family:inherit}
input{font-family:inherit}
.svc-heading,.svc-section-title,.svc-row,.svc-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.svc-heading{margin-bottom:20px}.svc-heading h1{margin:0;font-size:24px}.svc-heading p{margin:5px 0 0;color:#55606E}
.svc-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}.svc-workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.svc-panel{padding:20px;background:#FFF;border:1px solid #D9DEE5;border-radius:12px;min-width:0}.svc-panel h2{margin:0;font-size:17px}.svc-panel h3{margin:0;font-size:16px}.svc-panel h4{margin:0;font-size:14px}
.svc-list,.svc-editor,.svc-preview{display:flex;flex-direction:column;gap:16px}.svc-list .svc-section-title{align-items:stretch;flex-direction:column}.svc-list-item{display:flex;flex-direction:column;gap:5px;width:100%;text-align:start;border:2px solid;border-radius:10px;padding:13px;cursor:pointer;font-size:15px;font-family:inherit}.svc-list-item span{font-size:12px;font-weight:400}.svc-list-note{border-top:1px solid #D9DEE5;padding-top:14px}
.svc-label{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:13px;font-weight:600;color:#55606E}.svc-panel input:not([type=checkbox]),.svc-panel select,.svc-panel textarea{width:100%;min-height:44px;border:1px solid #AEB6C2;border-radius:8px;padding:10px 12px;box-sizing:border-box;background:#FFF;color:#17202A;font-size:15px;font-family:inherit}.svc-panel textarea{resize:vertical}.svc-panel input:focus,.svc-panel select:focus,.svc-panel textarea:focus,.svc-button:focus-visible,.svc-list-item:focus-visible{outline:3px solid #A9DAD6;outline-offset:2px;border-color:#0B6E69}
.svc-button{min-height:44px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:600;background:#FFF;border:1px solid #AEB6C2;border-radius:8px;color:#17202A;cursor:pointer}.svc-primary{background:#0B6E69;border-color:#0B6E69;color:#FFF}.svc-danger{color:#9B1C1C;border-color:#E5BCBC}.svc-small{min-height:36px;padding:5px 10px}.svc-button:disabled{opacity:.45;cursor:default}.svc-row{justify-content:flex-start}
.svc-badge{display:inline-block;padding:5px 9px;border-radius:6px;background:#ECEFF3;color:#3D4652;font-size:12px;line-height:1.6}.svc-section{display:flex;flex-direction:column;gap:14px;padding-top:20px;border-top:1px solid #D9DEE5}.svc-section h3{color:#0B6E69;font-size:13px}.svc-section h3 span{color:#17202A;margin-inline-start:6px;font-size:16px}.svc-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.svc-subcard{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid #D9DEE5;border-radius:10px;background:#FAFBFC}.svc-area-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.svc-muted{font-size:12px;color:#55606E;margin:0;line-height:1.8}.svc-empty{font-size:13px;color:#55606E;background:#F4F5F7;padding:16px;border-radius:8px;margin:0}.svc-notice{padding:14px 16px;margin-bottom:16px;border-radius:10px;font-size:13px}.svc-notice p{margin:5px 0 12px}.svc-notice ul{padding-inline-start:20px;margin:8px 0 0}.svc-warning{background:#FBEFD9;border:1px solid #E9CF9F;color:#754108}.svc-success{background:#E3F1F0;border:1px solid #ABD5CF;color:#084F4B}.svc-actions{justify-content:flex-start;border-top:1px solid #D9DEE5;padding-top:18px}.svc-actions .svc-primary{min-width:145px}
.svc-preview{position:sticky;top:20px;background:#F9FBFB;border-color:#BFD7D4}.svc-eyebrow{color:#0B6E69;font-size:12px;font-weight:700}.svc-preview-body{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:1px solid #D9DEE5}.svc-preview-field{display:flex;flex-direction:column;gap:6px}.svc-preview-field>.svc-label{display:flex;flex-direction:row;align-items:center;gap:6px;flex-wrap:wrap}.svc-required{font-size:10px;color:#8A4B08}.svc-preview-total{display:flex;flex-direction:column;gap:4px;border-top:1px solid #D9DEE5;padding-top:16px;font-size:12px;color:#55606E}.svc-preview-total strong{font-size:24px;color:#0B6E69}.svc-preview-material{display:flex;justify-content:space-between;gap:8px;font-size:12px}.svc-check{display:flex;align-items:center;gap:8px;font-size:13px}.svc-check input,.svc-preview-field input[type=checkbox]{width:20px;height:20px;accent-color:#0B6E69}.svc-check:has(input:disabled){opacity:.45}
@media(max-width:1150px){.svc-workspace{grid-template-columns:minmax(0,1fr)}.svc-preview{position:static}.svc-layout{grid-template-columns:240px minmax(0,1fr)}}
@media(max-width:700px){.svc-layout{grid-template-columns:minmax(0,1fr)}.svc-list{max-height:330px;overflow:auto}.svc-form-grid{grid-template-columns:minmax(0,1fr)}.svc-area-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.svc-area-row>.svc-button{grid-column:1/-1}.svc-heading h1{font-size:21px}.svc-panel{padding:16px}}

.recon-panel{background:#FFF;border:1px solid #D9DEE5;border-radius:12px;padding:20px;min-width:0;box-sizing:border-box}.recon-panel h2,.recon-panel h3{margin:0;font-size:17px}.recon-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.recon-muted{font-size:12px;color:#55606E;line-height:1.8;margin:8px 0}.recon-table-wrap{overflow-x:auto;max-width:100%}.recon-table{width:100%;border-collapse:collapse;font-size:13px;text-align:start;min-width:390px}.recon-table th,.recon-table td{padding:10px 8px;border-bottom:1px solid #D9DEE5;text-align:start;font-variant-numeric:tabular-nums}.recon-table th{font-weight:600;color:#55606E;background:#F4F5F7}.recon-table .recon-cash{background:#F0F8F7}.recon-total{background:#E3F1F0;color:#084F4B;padding:12px;border-radius:8px;margin:12px 0;font-size:15px}.recon-entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid #D9DEE5}.recon-entry label,.recon-label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#55606E;font-weight:600}.recon-entry input,.recon-label input,.recon-label textarea{min-height:44px;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #AEB6C2;border-radius:8px;background:#FFF;color:#17202A;font-family:inherit;font-size:15px}.recon-diff{font-size:12px;margin-top:6px}.recon-refund{padding:10px 12px;border:1px solid #E9CF9F;border-radius:8px;background:#FFFAF0;font-size:12px;margin-top:8px}.recon-refund p{margin:4px 0}.recon-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.recon-button{min-height:44px;padding:8px 16px;border:1px solid #AEB6C2;border-radius:8px;background:#FFF;color:#17202A;font-family:inherit;font-size:14px;cursor:pointer}.recon-primary{background:#0B6E69;border-color:#0B6E69;color:#FFF}.recon-danger{border-color:#9B1C1C;color:#9B1C1C}.recon-button:disabled{opacity:.45;cursor:default}.recon-note{background:#FBEFD9;color:#754108;padding:10px 12px;border-radius:8px;font-size:12px;margin-top:10px}.recon-status{background:#E3F1F0;color:#084F4B;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:10px}@media(max-width:600px){.recon-entry{grid-template-columns:minmax(0,1fr)}.recon-panel{padding:14px}}

</style>
</head><body><nav aria-label="معاينات الأدوار" style="padding:8px 20px;background:#E3F1F0;font:13px system-ui;display:flex;gap:20px"><a href="Manager.html">معاينة المدير</a><a href="Main.html">معاينة الكاشير</a></nav><main id="screen"></main><script type="application/json" id="screen-template">"\n\n\u003cdiv dir=\"rtl\" style=\"min-height: 100vh; background: #F4F5F7; color: #17202A; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 15px; line-height: 1.6\">\n\n  \u003cheader style=\"background: #FFFFFF; border-bottom: 1px solid #D9DEE5\">\n    \u003cdiv style=\"max-width: 1360px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 0px\">\n        \u003cstrong style=\"font-size: 18px; font-weight: 700\">المدير: [اسم المدير]\u003c/strong>\n        \u003cspan style=\"color: #55606E; font-size: 13px\">[اسم العيادة] · بيانات تجريبية للعرض\u003c/span>\n      \u003c/div>\n      \u003cnav aria-label=\"أقسام المدير\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n        \u003ctemplate data-repeat list=\"{{tabs}}\" as=\"tb\" hint-placeholder-count=\"4\">\n          \u003cbutton type=\"button\" onClick=\"{{tb.pick}}\" aria-pressed=\"{{tb.selected}}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; background: {{tb.bg}}; color: {{tb.fg}}; border: 2px solid {{tb.border}}\">{{tb.label}}\u003c/button>\n        \u003c/template>\n      \u003c/nav>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv style=\"max-width: 1360px; margin: 0 auto; padding: 20px; box-sizing: border-box\">\n\n    \u003ctemplate data-condition value=\"{{isTasks}}\" hint-placeholder-val=\"{{true}}\">\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n        \u003csection style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          \u003ch2 style=\"margin: 0; font-size: 16px; font-weight: 700\">طلبات الخصم\u003c/h2>\n          \u003ctemplate data-repeat list=\"{{discounts}}\" as=\"r\" hint-placeholder-count=\"2\">\n            \u003cdiv style=\"border: 1px solid #D9DEE5; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n              \u003cdiv style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline\">\n                \u003cspan style=\"font-size: 15px; font-weight: 700\">{{r.customer}} · {{r.code}}\u003c/span>\n                \u003cspan style=\"font-size: 14px; font-variant-numeric: tabular-nums\">الوصل: {{r.total}}\u003c/span>\n              \u003c/div>\n              \u003cspan style=\"font-size: 13px; color: #55606E\">من الكاشير: [اسم الكاشير]\u003c/span>\n              \u003ctemplate data-condition value=\"{{r.isPending}}\" hint-placeholder-val=\"{{true}}\">\n                \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px\">\n                  \u003clabel style=\"display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #55606E\">\n                    \u003cspan>مبلغ الخصم (د.ع)\u003c/span>\n                    \u003cinput type=\"number\" min=\"250\" step=\"250\" value=\"{{r.amount}}\" onChange=\"{{r.onAmount}}\" style=\"min-height: 44px; width: 140px; padding: 0 12px; border: 1px solid #AEB6C2; border-radius: 8px; font-size: 16px; background: #FFFFFF; color: #17202A; box-sizing: border-box\">\n                  \u003c/label>\n                  \u003cbutton type=\"button\" onClick=\"{{r.approve}}\" disabled=\"{{r.invalid}}\" style=\"min-height: 44px; padding: 0 18px; background: {{r.approveBg}}; color: #FFFFFF; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer\">موافقة\u003c/button>\n                  \u003cbutton type=\"button\" onClick=\"{{r.reject}}\" style=\"min-height: 44px; padding: 0 18px; background: #FFFFFF; color: #9B1C1C; border: 1px solid #9B1C1C; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer\">رفض\u003c/button>\n                \u003c/div>\n              \u003c/template>\n              \u003ctemplate data-condition value=\"{{r.isClosed}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cspan style=\"align-self: flex-start; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 6px; background: {{r.chipBg}}; color: {{r.chipFg}}\">{{r.chip}}\u003c/span>\n              \u003c/template>\n            \u003c/div>\n          \u003c/template>\n        \u003c/section>\n\n        \u003csection style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          \u003ch2 style=\"margin: 0; font-size: 16px; font-weight: 700\">استلام الشفتات\u003c/h2>\n          \u003cp class=\"recon-muted\">طابق الكاش وكشف كل جهاز بشكل منفصل. المرتجع ينخصم من المصدر اللي رجعت منه الفلوس فعلياً.\u003c/p>\n          \u003ctemplate data-repeat list=\"{{shifts}}\" as=\"sh\" hint-placeholder-count=\"2\">\n            \u003cdiv class=\"recon-panel\" data-shift=\"{{sh.id}}\">\n              \u003ch3>{{sh.title}}\u003c/h3>\n              \u003cp class=\"recon-muted\">الفكة: {{sh.float}} · المبالغ بالدينار العراقي\u003c/p>\n              \u003cdiv class=\"recon-table-wrap\">\u003ctable class=\"recon-table\">\u003cthead>\u003ctr>\u003cth>الطريقة / الجهاز\u003c/th>\u003cth>المقبوض\u003c/th>\u003cth>المرتجع فعلياً\u003c/th>\u003cth>الصافي\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctemplate data-repeat list=\"{{sh.rows}}\" as=\"r\">\u003ctr>\u003ctd>{{r.label}}\u003c/td>\u003ctd>{{r.paidText}}\u003c/td>\u003ctd>− {{r.refundedText}}\u003c/td>\u003ctd>{{r.netText}}\u003c/td>\u003c/tr>\u003c/template>\u003c/tbody>\u003c/table>\u003c/div>\n              \u003cdiv class=\"recon-total\">الكاش المتوقع تسليمه مع الفكة: \u003cstrong>{{sh.expected}}\u003c/strong>\u003c/div>\n              \u003ctemplate data-repeat list=\"{{sh.refunds}}\" as=\"rf\">\u003cdiv class=\"recon-refund\">\u003cstrong>استرجاع {{rf.amount}} · وصل {{rf.receipt}}\u003c/strong>\u003cp>الدفع الأصلي: {{rf.original}}\u003c/p>\u003cp>رجعنا الفلوس فعلياً: {{rf.actual}}\u003c/p>\u003ctemplate data-condition value=\"{{rf.previous}}\">\u003cp>الدفع كان بشفت سابق؛ الاسترجاع محسوب على هذا الشفت.\u003c/p>\u003c/template>\u003c/div>\u003c/template>\n              \u003ctemplate data-repeat list=\"{{sh.rows}}\" as=\"r\">\u003cdiv class=\"recon-entry\">\u003cdiv>\u003cstrong style=\"font-size:13px\">{{r.label}}\u003c/strong>\u003cp class=\"recon-muted\">المتوقع: {{r.expectedText}}\u003cbr>سجله الكاشير: {{r.countedText}}\u003c/p>\u003cdiv class=\"recon-diff\">{{r.difference}}\u003c/div>\u003c/div>\u003clabel>{{r.label}} · المبلغ المتحقق منه\u003cinput inputmode=\"numeric\" value=\"{{r.entered}}\" onChange=\"{{r.change}}\" disabled=\"{{sh.isClosed}}\">\u003c/label>\u003c/div>\u003c/template>\n              \u003clabel class=\"recon-label\" style=\"margin-top:12px\">ملاحظة المطابقة\u003cinput value=\"{{sh.note}}\" onChange=\"{{sh.onNote}}\" disabled=\"{{sh.isClosed}}\" placeholder=\"سبب النقص أو الزيادة\">\u003c/label>\n              \u003ctemplate data-condition value=\"{{sh.needsNote}}\">\u003cp class=\"recon-note\">أكو فرق؛ اكتب ملاحظتك قبل تأكيد الاستلام. فرق الجهاز يبقى منفصل عن فرق الكاش.\u003c/p>\u003c/template>\n              \u003ctemplate data-condition value=\"{{sh.isPending}}\">\u003cdiv class=\"recon-actions\">\u003cbutton class=\"recon-button recon-primary\" onClick=\"{{sh.confirm}}\" disabled=\"{{sh.confirmDisabled}}\">تأكيد الكاش ومطابقة الأجهزة\u003c/button>\u003c/div>\u003c/template>\n              \u003ctemplate data-condition value=\"{{sh.isClosed}}\">\u003cdiv class=\"recon-status\" role=\"status\">{{sh.chip}}\u003c/div>\u003c/template>\n            \u003c/div>\n          \u003c/template>\n        \u003c/section>\n\n        \u003csection style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px\">\n            \u003ch2 style=\"margin: 0; font-size: 16px; font-weight: 700\">جلسات مدفوعة ما تنفذت\u003c/h2>\n            \u003cspan style=\"font-size: 13px; color: #55606E\">للعلم. الكاشير هو اللي يتصرف بيها.\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"border: 1px solid #D9DEE5; border-radius: 10px; padding: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px\">\n            \u003cspan style=\"flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 2px\">\n              \u003cspan style=\"font-size: 15px; font-weight: 600\">هدى كريم · تنظيف بشرة\u003c/span>\n              \u003cspan style=\"font-size: 13px; color: #55606E\">اندفعت أمس · وصل \u003cbdi dir=\"ltr\">2026-00118\u003c/bdi>\u003c/span>\n            \u003c/span>\n            \u003cspan style=\"flex: none; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: #FBEFD9; color: #8A4B08\">بانتظار الكاشير\u003c/span>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          \u003ch2 style=\"margin: 0; font-size: 16px; font-weight: 700\">تنبيهات المخزون\u003c/h2>\n          \u003ctemplate data-repeat list=\"{{alerts}}\" as=\"al\" hint-placeholder-count=\"3\">\n            \u003cdiv style=\"display: flex; align-items: center; gap: 12px; border: 1px solid #D9DEE5; border-radius: 10px; padding: 12px 14px\">\n              \u003cspan style=\"flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600\">{{al.text}}\u003c/span>\n              \u003cspan style=\"flex: none; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: {{al.bg}}; color: {{al.fg}}\">{{al.tag}}\u003c/span>\n            \u003c/div>\n          \u003c/template>\n        \u003c/section>\n\n      \u003c/div>\n    \u003c/template>\n\n    \u003ctemplate data-condition value=\"{{isStock}}\" hint-placeholder-val=\"{{false}}\">\n      \u003csection style=\"background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px\">\n          \u003ch2 style=\"margin: 0; font-size: 16px; font-weight: 700\">المخزون\u003c/h2>\n          \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            \u003cbutton type=\"button\" style=\"min-height: 44px; padding: 0 16px; background: #17202A; color: #FFFFFF; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer\">فاتورة شراء\u003c/button>\n            \u003cbutton type=\"button\" style=\"min-height: 44px; padding: 0 16px; background: #FFFFFF; color: #17202A; border: 1px solid #AEB6C2; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer\">جرد\u003c/button>\n            \u003cbutton type=\"button\" style=\"min-height: 44px; padding: 0 16px; background: #FFFFFF; color: #17202A; border: 1px solid #AEB6C2; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer\">تسجيل تالف\u003c/button>\n            \u003cbutton type=\"button\" style=\"min-height: 44px; padding: 0 16px; background: #FFFFFF; color: #17202A; border: 1px solid #AEB6C2; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer\">مرتجع للمورد\u003c/button>\n          \u003c/div>\ solid {{ty.border}}\">{{ty.label}}\u003c/button>\n            \u003c/template>\n          \u003c/div>\n\n          \u003clabel style=\"display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #55606E\">\n            \u003cspan>المبلغ (د.ع)\u003c/span>\n            \u003cinput type=\"number\" min=\"0\" step=\"250\" value=\"{{f.amount}}\" onChange=\"{{onAmount}}\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #AEB6C2; border-radius: 8px; font-size: 16px; background: #FFFFFF; color: #17202A; box-sizing: border-box; width: 100%\">\n          \u003c/label>\n          \u003clabel style=\"display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #55606E\">\n            \u003cspan>{{noteLabel}}\u003c/span>\n            \u003cinput type=\"text\" value=\"{{f.note}}\" onChange=\"{{onNote}}\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #AEB6C2; border-radius: 8px; font-size: 15px; background: #FFFFFF; color: #17202A; box-sizing: border-box; width: 100%\">\n          \u003c/label>\n\n          \u003ctemplate data-condition value=\"{{showSource}}\" hint-placeholder-val=\"{{true}}\">\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\n              \u003cspan style=\"font-size: 13px; font-weight: 600; color: #55606E\">طريقة الدفع\u003c/span>\n              \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n                \u003ctemplate data-repeat list=\"{{sources}}\" as=\"so\" hint-placeholder-count=\"2\">\n                  \u003cbutton type=\"button\" onClick=\"{{so.pick}}\" aria-pressed=\"{{so.selected}}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{so.bg}}; color: {{so.fg}}; border: 2px solid {{so.border}}\">{{so.label}}\u003c/button>\n                \u003c/template>\n              \u003c/div>\n            \u003c/div>\n          \u003c/template>\n          \u003ctemplate data-condition value=\"{{showBank}}\" hint-placeholder-val=\"{{false}}\">\n            \u003clabel style=\"display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #55606E\">\n              \u003cspan>اسم المصرف\u003c/span>\n              \u003cinput type=\"text\" value=\"{{f.bank}}\" onChange=\"{{onBank}}\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #AEB6C2; border-radius: 8px; font-size: 15px; background: #FFFFFF; color: #17202A; box-sizing: border-box; width: 100%\">\n            \u003c/label>\n          \u003c/template>\n          \u003ctemplate data-condition value=\"{{isOwnerType}}\" hint-placeholder-val=\"{{false}}\">\n            \u003cspan style=\"font-size: 13px; color: #55606E\">السحب ما ينقص من الخزنة إلا بعد ما يوافق المالك من حسابه.\u003c/span>\n          \u003c/template>\n\n          \u003cbutton type=\"button\" onClick=\"{{record}}\" disabled=\"{{recordDisabled}}\" style=\"min-height: 52px; padding: 0 20px; background: {{recordBg}}; color: #FFFFFF; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer\">{{recordLabel}}\u003c/button>\n        \u003c/section>\n\n        \u003csection style=\"flex: 999 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n          \u003ch2 style=\"margin: 0; font-size: 16px; font-weight: 700\">حركات الخزنة\u003c/h2>\n          \u003ctemplate data-repeat list=\"{{moves}}\" as=\"mv\" hint-placeholder-count=\"4\">\n            \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1px solid #D9DEE5; border-radius: 10px; padding: 12px 14px\">\n              \u003cspan style=\"flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px\">\n                \u003cspan style=\"font-size: 15px; font-weight: 600\">{{mv.label}}\u003c/span>\n                \u003cspan style=\"font-size: 13px; color: #55606E\">{{mv.sub}}\u003c/span>\n              \u003c/span>\n              \u003ctemplate data-condition value=\"{{mv.canApprove}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cbutton type=\"button\" onClick=\"{{mv.approve}}\" style=\"flex: none; min-height: 44px; padding: 0 12px; background: transparent; color: #0B6E69; border: none; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline\">تجربة: المالك وافق\u003c/button>\n              \u003c/template>\n              \u003cspan style=\"flex: none; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: {{mv.chipBg}}; color: {{mv.chipFg}}\">{{mv.chip}}\u003c/span>\n              \u003cspan style=\"flex: none; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{mv.amountFg}}\">{{mv.amount}}\u003c/span>\n            \u003c/div>\n          \u003c/template>\n        \u003c/section>\n\n      \u003c/div>\n    \u003c/template>\n\n    \u003ctemplate data-condition value=\"{{isServices}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv class=\"svc-heading\">\u003cdiv>\u003ch1>الخدمات والأسعار\u003c/h1>\u003cp>رتّب الخدمات وحقول الطبيب والمواد اللي تستهلكها كل جلسة.\u003c/p>\u003c/div>\u003cspan class=\"svc-badge\">نموذج تفاعلي · الحفظ للتجربة فقط\u003c/span>\u003c/div>\n      \u003ctemplate data-condition value=\"{{hasServiceMessage}}\">\u003cdiv class=\"svc-notice svc-success\" role=\"status\">{{serviceMessage}}\u003c/div>\u003c/template>\n      \u003ctemplate data-condition value=\"{{hasServicePending}}\">\u003cdiv class=\"svc-notice svc-warning\" role=\"alert\">\u003cstrong>عندك تعديلات ما انحفظت.\u003c/strong>\u003cp>تگدر تكمل تعديلك، أو تتجاهل التعديلات وتنتقل.\u003c/p>\u003cdiv class=\"svc-row\">\u003cbutton class=\"svc-button\" onClick=\"{{keepService}}\">كمل التعديل\u003c/button>\u003cbutton class=\"svc-button svc-danger\" onClick=\"{{discardService}}\">تجاهل التعديلات وانتقل\u003c/button>\u003c/div>\u003c/div>\u003c/template>\n      \u003cdiv class=\"svc-layout\">\n        \u003caside class=\"svc-panel svc-list\" aria-label=\"قائمة الخدمات\">\n          \u003cdiv class=\"svc-section-title\">\u003ch2>الخدمات\u003c/h2>\u003cbutton class=\"svc-button svc-primary\" onClick=\"{{addService}}\">+ خدمة جديدة\u003c/button>\u003c/div>\n          \u003clabel class=\"svc-label\" for=\"svc-search\">بحث عن خدمة\u003cinput id=\"svc-search\" type=\"search\" value=\"{{serviceQuery}}\" onChange=\"{{onServiceQuery}}\" placeholder=\"اسم الخدمة\">\u003c/label>\n          \u003ctemplate data-repeat list=\"{{serviceList}}\" as=\"sv\">\u003cbutton class=\"svc-list-item\" onClick=\"{{sv.pick}}\" aria-pressed=\"{{sv.selected}}\" style=\"background: {{sv.bg}}; color: {{sv.fg}}; border-color: {{sv.border}}\">\u003cstrong>{{sv.name}}\u003c/strong>\u003cspan>{{sv.description}}\u003c/span>\u003c/button>\u003c/template>\n          \u003ctemplate data-condition value=\"{{serviceListEmpty}}\">\u003cp class=\"svc-muted\">ماكو خدمة بهذا الاسم. جرّب اسم ثاني.\u003c/p>\u003c/template>\n          \u003cp class=\"svc-muted svc-list-note\">الأسعار والأسماء هنا أمثلة، وتگدر تعدلها.\u003c/p>\n        \u003c/aside>\n        \u003cdiv class=\"svc-workspace\">\n          \u003csection class=\"svc-panel svc-editor\" aria-label=\"إعدادات الخدمة\">\n            \u003cdiv class=\"svc-section-title\">\u003ch2>{{serviceTitle}}\u003c/h2>\u003cspan class=\"svc-badge\">{{serviceStatus}}\u003c/span>\u003c/div>\n            \u003clabel class=\"svc-label\" for=\"svc-name\">اسم الخدمة\u003cinput id=\"svc-name\" value=\"{{serviceName}}\" onChange=\"{{onServiceName}}\" placeholder=\"مثال: تنظيف بشرة\">\u003c/label>\n            \u003cdiv class=\"svc-section\">\u003ch3>01 \u003cspan>طريقة التسعير\u003c/span>\u003c/h3>\u003cdiv class=\"svc-row\">\u003ctemplate data-repeat list=\"{{serviceKinds}}\" as=\"k\">\u003cbutton class=\"svc-button\" onClick=\"{{k.pick}}\" aria-pressed=\"{{k.selected}}\" style=\"backg }

function children(parent, scope, key) {
  const fragment = document.createDocumentFragment();
  [...parent.childNodes].forEach((child, index) => fragment.appendChild(build(child, scope, key + ':' + index)));

}

    list.forEach((item, index) => fragment.appendChild(children(node.content, Object.assign({}, scope, {[node.getAttribute('as')]: item}), key + ':' + index)));
    return fragment;
  }
  if (node.matches('template[data-condition]')) return binding(node.getAttribute('value'), scope) ? children(node.content, scope, key) : document.createDocumentFragment();
  const output = node.cloneNode(false);
  for (const attr of [...node.attributes]) {
    if (attr.name.startsWith('hint-')) { output.removeAttribute(attr.name); continue; }
    const resolved = binding(attr.value, scope);
    if (/^on(click|change)$/.test(attr.name)) {
      output.removeAttribute(attr.name);
      if (typeof resolved === 'function') {
        const inputEvent = attr.name === 'onchange' && (node.tagName === 'TEXTAREA' || (node.tagName === 'INPUT' && !['checkbox','radio'].includes(node.type)));
        output.addEventListener(inputEvent ? 'input' : attr.name.slice(2), (event) => resolved(event));
      }
    } else if (['checked', 'disabled', 'selected', 'required'].includes(attr.name)) {
      output.removeAttribute(attr.name);
      output[attr.name] = !!resolved;
    } else { output.setAttribute(attr.name, resolved ?? ''); }
  }
  output.appendChild(children(node, scope, key));
  if (node.hasAttribute('value') && ['INPUT', 'TEXTAREA', 'SELECT'].includes(node.tagName)) output.value = binding(node.getAttribute('value'), scope) ?? '';

class Component extends DCLogic {

  shiftMoney(value, allowNegative) {
    const text = String(value == null ? '' : value).trim().replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 1632)).replace(/[۰-۹]/g, (c) => String(c.charCodeAt(0) - 1776));

  shiftBaseEvents() {

      note: cur.note || '', needsNote: mismatch, confirmDisabled: !!cur.closed || invalid, isPending: !cur.closed, isClosed: !!cur.closed,

      onNote: (e) => { if (!((this.state.shift || {})[sh.id] || {}).closed) { this.merge('shift', sh.id, { note: e.target.value }); } },
      confirm: () => {
        const latest = this.managerShift(sh);

  serviceClone(value) { return JSON.parse(JSON.stringify(value)); }

      Object.assign(this.serviceBlank(), { id: 'laser', name: 'ليزر', kind: 'areas', fullPrice: '140000', areas: [{ id: 'face', label: 'وجه', price: '25000' }, { id: 'underarms', label: 'إبط', price: '20000' }, { id: 'arms', label: 'يدين', price: '40000' }, { id: 'legs', label: 'رجلين', price: '60000' }], fields: [notes()], materials: [{ id: 'mg', materialId: 'gel', basis: 'fixed', fieldId: '', quantity: '1' }], version: 1 }),
